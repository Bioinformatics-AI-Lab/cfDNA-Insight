[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdna-insight"
version = "0.1.0"
description = "Fragmentomic and copy-number features for cfDNA cancer classification"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24", "pandas>=2.0", "scipy>=1.10",
    "scikit-learn>=1.3", "matplotlib>=3.7", "pyarrow>=12",
]

[project.optional-dependencies]
full = ["pysam>=0.22"]
dev = ["pytest>=7.4", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 88
target-version = "py310"
